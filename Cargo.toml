[package]
name = "soli-agent"
version = "0.1.0"
edition = "2024"
default-run = "soli-agent"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
bs58 = "0.5"
base64 = "0.22"
wincode = "0.6"
solana-transaction = { version = "6", features = ["wincode", "verify"] }
solana-message = { version = "6", features = ["wincode"] }
solana-pubkey = "4.4"
solana-signature = { version = "3.6", features = ["verify"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
ed25519-dalek = "2.2"
tempfile = "3"
zeroize = "1"
rmcp = { version = "3.8", features = ["transport-io", "client", "transport-child-process"] }
rpassword = "7"
dotenvy = "0.15"
toml_edit = "0.25"
sysinfo = "0.37"
self-replace = "1.5"

[dev-dependencies]
solana-instruction = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }
